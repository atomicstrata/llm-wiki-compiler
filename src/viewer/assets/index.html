<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>llmwiki viewer</title>
    <link rel="icon" type="image/png" href="/assets/llmwiki-logo-64.png" />
    <script src="/assets/viewer-theme-boot.js"></script>
    <link rel="stylesheet" href="/assets/viewer-tokens.css" />
    <link rel="stylesheet" href="/assets/viewer-content.css" />
    <link rel="stylesheet" href="/assets/viewer-chrome.css" />
    <link rel="stylesheet" href="/assets/viewer-dashboard.css" />
    <link rel="stylesheet" href="/assets/viewer-health.css" />
    <link rel="stylesheet" href="/assets/viewer-pipeline.css" />
    <link rel="stylesheet" href="/assets/viewer-graph.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-pane">Skip to main content</a>
    <div class="app-shell">
      <div class="app-layout">
        <nav class="sidebar" aria-label="Wiki navigation">
          <div class="sidebar-nav" data-sidebar></div>
        </nav>
        <div class="main-column">
          <header class="app-header">
            <div class="app-identity">
              <div class="app-brand">
                <img
                  class="app-logo"
                  src="/assets/llmwiki-logo-64.png"
                  width="22"
                  height="22"
                  alt=""
                  aria-hidden="true"
                />
                <strong class="app-title" data-app-title>llmwiki</strong>
                <span class="freshness-pill" data-verdict hidden></span>
              </div>
              <p class="app-meta" data-app-meta></p>
            </div>
            <div class="app-actions">
              <form class="sidebar-search" role="search" data-search-form autocomplete="off">
                <label for="search-input" class="visually-hidden">Search wiki</label>
                <span class="search-icon" aria-hidden="true"></span>
                <input
                  id="search-input"
                  type="search"
                  placeholder="Search…"
                  aria-controls="search-results"
                  data-search-input
                />
                <span class="search-kbd" aria-hidden="true">⌘K</span>
                <ul
                  id="search-results"
                  class="search-results"
                  role="listbox"
                  aria-label="Search results"
                  data-search-results
                  hidden
                ></ul>
              </form>
              <button
                class="chrome-button"
                type="button"
                data-theme-toggle="dark"
                aria-label="Switch to light theme"
                aria-pressed="false"
              >
                <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                  <circle cx="12" cy="12" r="4.2"></circle>
                  <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6"></path>
                </svg>
                <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                     stroke-linejoin="round" aria-hidden="true">
                  <path d="M20.2 14.6A8.6 8.6 0 0 1 9.4 3.8a8.6 8.6 0 1 0 10.8 10.8z"></path>
                </svg>
              </button>
              <a
                class="github-link"
                href="https://github.com/atomicstrata/llm-wiki-compiler"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Open llm-wiki-compiler on GitHub, 1.3k stars"
              >
                <svg class="github-mark" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                  <path
                    d="M8 0C3.58 0 0 3.64 0 8.13c0 3.59 2.29 6.63 5.47 7.71.4.08.55-.18.55-.39 0-.19-.01-.83-.01-1.5-2.01.37-2.53-.5-2.69-.96-.09-.24-.48-.96-.82-1.15-.28-.15-.68-.52-.01-.53.63-.01 1.08.59 1.23.83.72 1.23 1.87.88 2.33.67.07-.53.28-.88.51-1.08-1.78-.21-3.64-.9-3.64-4 0-.88.31-1.61.82-2.18-.08-.2-.36-1.03.08-2.15 0 0 .67-.22 2.2.83A7.47 7.47 0 0 1 8 3.96c.68 0 1.36.09 2 .27 1.53-1.05 2.2-.83 2.2-.83.44 1.12.16 1.95.08 2.15.51.57.82 1.29.82 2.18 0 3.11-1.87 3.79-3.65 4 .29.25.54.74.54 1.5 0 1.08-.01 1.95-.01 2.22 0 .21.15.47.55.39A8.05 8.05 0 0 0 16 8.13C16 3.64 12.42 0 8 0Z"
                  />
                </svg>
                <span>GitHub</span>
                <span class="github-stars" aria-hidden="true">★ 1.3k</span>
              </a>
            </div>
          </header>
          <div class="content-grid">
            <main id="main-pane" class="main-pane" tabindex="-1" data-main-pane>
              <p class="placeholder">Loading your knowledge base…</p>
            </main>
            <aside class="support-rail" aria-label="Page metadata" data-support-rail></aside>
          </div>
        </div>
      </div>
    </div>
    <script src="/assets/d3.min.js"></script>
    <script type="module" src="/assets/viewer.js"></script>
  </body>
</html>
